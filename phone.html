<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08100b">
  <title>OCR NF-e</title>

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" integrity="sha384-PMNj1TmCgXfW24/rfIyxYSAWwj2mffkMfguUWv08iNFcy0kTC0JN7E/tE+pJ7+fa" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js" integrity="sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F" crossorigin="anonymous"></script>

  <style>
    /* Mesmos tokens do viewer.html (ver visual.md) */
    :root {
      --surface: #0d1812;
      --border: rgba(255,255,255,.08);
      --text: #eaf6ee;
      --muted: #9fb5a5;
      --green: #22c55e;
      --green-2: #16a34a;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { background: #050806; }
    body {
      margin: 0; min-height: 100dvh;
      font-family: 'Satoshi', system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(34,197,94,.16), transparent 28%),
        radial-gradient(circle at top right, rgba(239,68,68,.12), transparent 30%),
        linear-gradient(180deg, #08100b, #050806 70%);
      color: var(--text);
    }
    button { font: inherit; }
    .app {
      max-width: 520px; min-height: 100dvh; margin: 0 auto; padding: 14px 14px 0;
      display: flex; flex-direction: column; gap: 12px;
    }
    .panel {
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    h1 { font-size: 1.05rem; margin: 0 0 4px; }
    p { margin: 0; color: var(--muted); font-size: .86rem; }
    .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

    /* ---- cabeçalho + status ---- */
    .hero { padding: 14px; display: grid; gap: 12px; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .logo {
      flex: none; width: 46px; height: 46px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(34,197,94,.24), rgba(239,68,68,.24));
      border: 1px solid var(--border);
      display: grid; place-items: center; font-weight: 900;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px; width: fit-content;
      padding: 8px 12px; border-radius: 999px; border: 1px solid transparent;
      font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: .78rem;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 14px currentColor; }
    .status-pill[data-tipo="ok"] { background: rgba(34,197,94,.1); color: #b8f5c8; border-color: rgba(34,197,94,.24); }
    .status-pill[data-tipo="wait"] { background: rgba(245,158,11,.12); color: #ffd79f; border-color: rgba(245,158,11,.28); }
    .status-pill[data-tipo="err"] { background: rgba(239,68,68,.12); color: #ffc1c1; border-color: rgba(239,68,68,.28); }

    /* ---- PIN ---- */
    .pin-panel { padding: 14px; display: grid; gap: 8px; text-align: center; border-color: rgba(34,197,94,.26); }
    #pin {
      font-size: 2.4rem; font-weight: 900; letter-spacing: .3em; padding: 6px 0 6px .3em;
      font-variant-numeric: tabular-nums; color: var(--text);
      background: #0b130f; border: 1px solid var(--border); border-radius: 14px;
    }

    /* ---- câmera ---- */
    .camera { position: relative; overflow: hidden; line-height: 0; }
    /* largura sempre 100% e corte só em cima/embaixo (câmera em retrato): o centro e a
       largura continuam coincidindo com o recorte do OCR */
    video { width: 100%; min-height: 140px; max-height: 36dvh; object-fit: cover; background: #0b130f; }
    .overlay { position: absolute; inset: 0; pointer-events: none; }
    /* tamanho definido pelo script (ajustarMira) = recorte do OCR; o contorno fica
       por fora para não cobrir a área lida */
    .alvo {
      position: absolute; left: 50%; top: 50%; width: 92%; height: 24px;
      transform: translate(-50%, -50%);
      border-radius: 4px; outline: 2px solid var(--green);
      box-shadow: 0 0 0 100vmax rgba(5,8,6,.58);
      animation: pulso 1.6s infinite ease-in-out;
    }
    @keyframes pulso { 50% { outline-color: rgba(34,197,94,.45); } }
    @media (prefers-reduced-motion: reduce) { .alvo { animation: none; } }

    /* ---- recorte e última leitura ---- */
    .leitura { padding: 14px; display: grid; gap: 10px; }
    .recorte {
      min-height: 40px; display: grid; place-items: center; padding: 6px;
      background: #0b130f; border: 1px solid var(--border); border-radius: 12px;
    }
    #preview { display: block; width: 100%; border-radius: 6px; }
    #preview:not([src]) { display: none; }
    #preview[src] + p { display: none; }
    #last-key {
      font-size: .94rem; font-weight: 700; text-align: center; word-break: break-all; color: #b8f5c8;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); border-radius: 12px; padding: 12px;
    }

    /* ---- botão fixo no rodapé ---- */
    .acao {
      position: sticky; bottom: 0; margin-top: auto;
      padding: 12px 0 calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, #050806 40%);
    }
    #captureBtn {
      width: 100%; border: none; cursor: pointer; border-radius: 14px; padding: 18px;
      font-weight: 900; font-size: 1.05rem; color: #06210f;
      background: linear-gradient(180deg, var(--green), var(--green-2));
      box-shadow: var(--shadow);
    }
    #captureBtn:hover { filter: brightness(1.08); }
    #captureBtn:active { transform: scale(.99); }

    /* telas baixas: compacta o topo para a câmera caber acima do botão */
    @media (max-height: 700px) {
      .app { gap: 8px; }
      .hero, .pin-panel { padding: 10px; gap: 8px; }
      .logo { width: 36px; height: 36px; }
      #pin { font-size: 1.6rem; padding-top: 2px; padding-bottom: 2px; }
      .pin-panel p { display: none; }
      .acao { padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
      #captureBtn { padding: 12px; }
    }
    /* celular deitado: câmera primeiro, visível sem rolar */
    @media (max-height: 500px) {
      .camera { order: -1; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="panel hero">
      <div class="brand">
        <div class="logo">NF</div>
        <div>
          <h1>Scanner NF-e</h1>
          <p>Enquadre a chave de acesso na faixa verde.</p>
        </div>
      </div>
      <div class="status-pill" data-tipo="wait" role="status">
        <span class="status-dot"></span><span id="status">iniciando câmera...</span>
      </div>
    </header>

    <section class="panel pin-panel">
      <div class="label">PIN de conexão</div>
      <div id="pin">------</div>
      <p>Digite no painel do desktop para conectar.</p>
    </section>

    <div class="panel camera">
      <video id="video" autoplay playsinline muted></video>
      <div class="overlay">
        <div id="alvo" class="alvo"></div>
      </div>
    </div>

    <section class="panel leitura">
      <div class="label">Recorte lido</div>
      <div class="recorte">
        <img id="preview" alt="Recorte enviado ao OCR">
        <p>O recorte aparece aqui após a captura.</p>
      </div>
      <div class="label">Última leitura</div>
      <div id="last-key">nenhuma chave lida</div>
    </section>

    <div class="acao">
      <button id="captureBtn" type="button">Capturar chave</button>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>

<script>
// ============================================================================
// src/phone/script.js — leitor de chave por OCR no celular
//
// Módulos: DOM/CONEXÃO (PeerJS com ID = PIN de 6 dígitos exibido na tela),
// CÂMERA (traseira 1920x1080), CAPTURA (recorte da faixa + preview),
// OCR (Tesseract, extração dos 44 dígitos e envio) e BOOT.
// ============================================================================

// ===== DOM =====

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const captureBtn = document.getElementById("captureBtn");
const lastKey = document.getElementById("last-key");
const preview = document.getElementById("preview");
const pinEl = document.getElementById("pin");
const alvo = document.getElementById("alvo");

// Faixa do vídeo entregue ao OCR; a área verde é desenhada a partir dela.
const RECORTE_LARGURA = 0.92; // fração da largura do vídeo
const RECORTE_ALTURA = 90;    // pixels do vídeo

const PRAZO_ABERTURA_MS = 15000; // painel que não abre o canal nesse prazo é descartado
const RECONEXAO_MS = 3000;       // espera antes de voltar ao servidor de sinalização

// Texto + tom do selo (ok | wait | err), as mesmas cores de estado do viewer.
function definirStatus(texto, tipo) {
    status.innerText = texto;
    status.parentElement.dataset.tipo = tipo;
}

// ===== CONEXÃO =====
// O PIN gerado aqui É o PeerID da sessão do celular: quem digitar esse número
// no viewer conecta. O celular atende um painel por vez. O PIN evita conexões
// cruzadas, mas não é autenticação forte.

let conn = null;
let peer = null;

function novoPIN() {
    const [sorteio] = crypto.getRandomValues(new Uint32Array(1));
    return String(100000 + (sorteio % 900000));
}

function iniciarPeer(pin) {
    const atual = new Peer(pin);
    peer = atual;

    peer.on("connection", atenderViewer);
    peer.on("open", () => {
        if (status.textContent === "erro de conexão") definirStatus("conexão restabelecida", "ok");
    });
    peer.on("disconnected", () => setTimeout(() => {
        if (atual === peer && !atual.destroyed && atual.disconnected) atual.reconnect();
    }, RECONEXAO_MS));

    // PIN já em uso por outro peer no servidor: gera outro e a tela atualiza.
    peer.on("error", err => {
        if (err && err.type === "unavailable-id") {
            iniciarPeer(novoPIN());
            return;
        }
        // com um painel já ligado (P2P), a queda do servidor não interrompe o uso
        if (!conn?.open) definirStatus("erro de conexão", "err");
    });

    pinEl.innerText = pin;
}

function atenderViewer(connection) {
    // Já há um painel: o recém-chegado é desligado assim que o canal abre.
    if (conn) {
        connection.on("open", () => connection.close());
        return;
    }

    conn = connection;
    definirStatus("conectando viewer...", "wait");

    // Painel morto nem sempre emite "close": prazo de abertura e estado do WebRTC
    // também liberam o celular para o próximo.
    const liberar = () => {
        if (conn !== connection) return;
        conn = null;
        clearTimeout(prazo);
        definirStatus("viewer desconectado", "err");
        connection.close();
    };
    const prazo = setTimeout(liberar, PRAZO_ABERTURA_MS);

    connection.on("open", () => {
        clearTimeout(prazo);
        definirStatus("viewer conectado", "ok");
    });
    connection.on("close", liberar);
    connection.on("error", liberar);
    connection.peerConnection?.addEventListener("connectionstatechange", () => {
        if (connection.peerConnection?.connectionState === "failed") liberar();
    });
}

iniciarPeer(novoPIN());

// ===== CÂMERA =====

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                aspectRatio: 16 / 9
            },
            audio: false
        });

        video.srcObject = stream;
        definirStatus(conn?.open ? "viewer conectado" : "câmera pronta", "ok");
    } catch (err) {
        console.error(err);
        definirStatus("erro câmera", "err");
    }
}

// ===== CAPTURA =====

function captureFrame() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const cropWidth = vw * RECORTE_LARGURA;
    const cropHeight = RECORTE_ALTURA;
    const cropX = (vw - cropWidth) / 2;
    const cropY = (vh / 2) - (cropHeight / 2);

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    ctx.drawImage(
        video,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, cropWidth, cropHeight
    );

    preprocess();
}

// Projeção do recorte no preview (sem pré-processamento)
function preprocess() {
    preview.src = canvas.toDataURL("image/png");
}

// Desenha a área verde com o tamanho que o recorte ocupa na tela. O vídeo usa
// object-fit: cover, então a escala é a maior das duas razões tela/vídeo.
function ajustarMira() {
    const { videoWidth, videoHeight, clientWidth, clientHeight } = video;
    if (!videoWidth || !videoHeight || !clientWidth) return;

    const escala = Math.max(clientWidth / videoWidth, clientHeight / videoHeight);
    alvo.style.width = `${videoWidth * RECORTE_LARGURA * escala}px`;
    alvo.style.height = `${RECORTE_ALTURA * escala}px`;
}

// ===== OCR =====

async function processOCR() {
    if (!conn?.open) {
        alert("viewer não conectado");
        return;
    }

    definirStatus("lendo chave...", "wait");
    captureFrame();

    try {
        const result = await Tesseract.recognize(
            canvas,
            "eng",
            {
                tessedit_pageseg_mode: 7,
                tessedit_char_whitelist: "0123456789",
                preserve_interword_spaces: 0
            }
        );

        let text = result.data.text;
        console.log(text);

        // limpa caracteres inválidos
        text = text.replace(/\D/g, "");

        // procura exatamente 44 dígitos
        const match = text.match(/\d{44}/);

        if (match) {
            const key = match[0];

            console.log("CHAVE:", key);
            lastKey.innerText = key;

            // o painel pode ter caído enquanto o OCR rodava
            if (!conn?.open) {
                definirStatus("chave não enviada", "err");
                navigator.vibrate?.(100);
                return;
            }

            conn.send({
                type: "nfe",
                key,
                image: canvas.toDataURL("image/jpeg", 0.7)
            });

            definirStatus("chave enviada", "ok");
            navigator.vibrate?.(300);
        } else {
            lastKey.innerText = text || "nenhum número encontrado";
            definirStatus(`faltando dígitos (${text.length}/44)`, "err");
            navigator.vibrate?.(100);
            console.log("OCR INVÁLIDO:", text);
        }
    } catch (err) {
        console.error(err);
        definirStatus("erro OCR", "err");
    }
}

// ===== BOOT =====
captureBtn.onclick = processOCR;
video.addEventListener("loadedmetadata", ajustarMira);
video.addEventListener("resize", ajustarMira); // câmera mudou de orientação
window.addEventListener("resize", ajustarMira);
startCamera();
</script>

</body>

</html>
