server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/dtgames.myddns.me.key;
  ssl_certificate /etc/nginx/ssl-certificates/dtgames.myddns.me.crt;
  server_name dtgames.myddns.me;
  root /home/myddns-dtgames/htdocs/dtgames.myddns.me;

  access_log /home/myddns-dtgames/logs/nginx/access.log main;
  error_log /home/myddns-dtgames/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  

  include /etc/nginx/global_settings;

  index index.html;

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|json|html|document)$ {
    add_header 'Access-Control-Allow-Origin' 'https://dtgames.myddns.me' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }
  location /receita/ {

    proxy_pass https://www.receitaws.com.br/;

    proxy_ssl_server_name on;

    proxy_set_header Host www.receitaws.com.br;

    add_header Access-Control-Allow-Origin * always;

    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {

        return 204;
    }
    }
    
  location /localapi/ {

    proxy_pass http://45.171.44.43:8000/;


    add_header Access-Control-Allow-Origin * always;

    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {

        return 204;
    }
    }
  location /danfe/ {

    proxy_pass https://ws.meudanfe.com.br/;

    add_header Access-Control-Allow-Origin * always;

    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    add_header Access-Control-Allow-Headers "*" always;

    if ($request_method = OPTIONS) {

        return 204;
    }
    }
    
    location /api/nfe/ {
    proxy_pass https://consultadanfe.com/api/v1/consulta;
    proxy_ssl_server_name on;

    proxy_set_header Origin "";
    proxy_set_header Host consultadanfe.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type application/json;

    # CORS para o navegador aceitar a resposta
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

    if ($request_method = OPTIONS) {
        return 204;
    }
    }
    
    location /api/nfe/fallback/ {
    # A barra no final é CRUCIAL para substituir o caminho corretamente
    proxy_pass https://api.danferapida.com.br/documents/b2b/search/;
    proxy_ssl_server_name on;

    # Headers essenciais para evitar bloqueio do Cloudflare (WAF)
    proxy_set_header Host api.danferapida.com.br;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_set_header Accept "application/json, text/plain, */*";
    proxy_set_header Accept-Language "pt-BR,pt;q=0.9,en-US;q=0.8,en;q=0.7";
    
    # Headers de encaminhamento padrão
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Injeção da API Key pelo próprio Nginx (evita CORS preflight no navegador)
    # IMPORTANTE: defina a chave via ambiente/symlink fora do git. Exemplo:
    #   include /etc/nginx/secrets/danferapida.key.conf;   # proxy_set_header x-api-key "<SUA_API_KEY>";
    # A chave real foi removida deste repositório por segurança.
    include /etc/nginx/secrets/danferapida.key.conf;

    # CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, x-api-key' always;

    if ($request_method = OPTIONS) {
        return 204;
    }
  }
  if (-f $request_filename) {
    break;
  }
}
